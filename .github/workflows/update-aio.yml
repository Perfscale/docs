name: Update AIO

on:
  push:
    branches:
      - main

jobs:
  update-aio:
    name: Trigger AIO update
    uses: Perfscale/infra/.github/workflows/reusable-update-aio.yml@main
    with:
      submodule: docs
      source-ref: ${{ github.ref_name }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}